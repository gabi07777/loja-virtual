<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <!DOCTYPE html>
    <html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Minha Loja</title>
    </head>

    <body>

        <main class="store">

            <div class="my-store">
                <h1 class="title">Minha Loja</h1>
                <h2 class="subtitle">
                    Qualidade, praticidade e os melhores preços
                </h2>
            </div>

            <section class="questions">

                <div class="name-customer">
                    <label for="name">Nome do Cliente</label>
                    <input type="text" id="name" placeholder="Digite seu nome...">
                </div>

                <div>
                    <label for="value">Valor da compra</label>
                    <input type="text" id="value" placeholder="Ex: 150,00">
                </div>

                <div>
                    <label for="age">Idade do Cliente</label>
                    <input type="text" id="age" placeholder="Ex: 20">
                </div>

                <div class="radio-option">
                    <label>Forma de pagamento:</label>
                    <div class="radio-option">
                        <input type="radio" name="forma" value="Pix">
                        <label>Pix</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="forma" value="Money">
                        <label>Dinheiro</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="forma" value="Card">
                        <label>Cartão</label>
                    </div>
                </div>

                <div>
                    <div class="radio-option">
                        <label>Possui cupom de desconto?</label>

                        <div class="radio-option">
                            <input type="radio" name="desconto" value="Yes">
                            <label>Sim</label>
                        </div>
                        <div class="radio-option">
                        <input type="radio" name="desconto" value="No">
                        <label>Não</label>
                        </div>
                    </div>

                    <div>
                        <button type="button">Calcular compra</button>
                    </div>

            </section>

        </main

        <script src="javas.js"></script>

    </body>
    </html>
</body>

</html>
